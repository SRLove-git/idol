<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>PC 预约订座 - 拼豆系统</title>
    <link rel="stylesheet" href="/resources/assets/css/app.css?v=0.4.1">
</head>
<body class="theme-blue terminal-page">
    
    <section class="pc-site">
        <header class="pc-front-nav">
            <a class="pc-front-logo" href="/app/pc">拼豆系统</a>
            <nav>
                                                        <a class="" href="/app/pc/home">首页</a>
                                                        <a class="" href="/app/pc/bead">智能拼豆</a>
                                                        <a class="is-active" href="/app/pc/reservation">预约订座</a>
                                                        <a class="" href="/app/pc/social">社交作品</a>
                                                        <a class="" href="/app/pc/market">交易市场</a>
                                                        <a class="" href="/app/pc/auction">拍卖专区</a>
                                                        <a class="" href="/app/pc/account">我的</a>
                            </nav>
            <span class="pc-front-user"><!--@auth--></span>
        </header>
        <!--@notice-->
                        <section class="pc-page-head">
        <div>
            <h1>PC 预约订座</h1>
            <p>门店筛选、日期筛选、座位平面图和支付核销。</p>
        </div>
            <div class="ui-actions">
                    <a class="is-primary" href="/action/reservation?back=/app/pc/reservation">新建预约</a>
                    <a class="" href="/app/pc/reservation">查看座位</a>
            </div>
        </section>
        <section class="kpi-row">
                    <article class="kpi-card tone-blue">
                <span>总用户</span>
                <strong>2</strong>
            </article>
                    <article class="kpi-card tone-green">
                <span>拼豆方案</span>
                <strong>4</strong>
            </article>
                    <article class="kpi-card tone-orange">
                <span>交易商品</span>
                <strong>5</strong>
            </article>
                    <article class="kpi-card tone-purple">
                <span>订单数量</span>
                <strong>1</strong>
            </article>
            </section>
                <section class="pc-two-col">    <section class="panel-card">
        <div class="panel-head">
            <div>
                <h2>座位状态</h2>
                <p>空闲、已预约、使用中、已结束、异常一屏查看。</p>
            </div>
            <div class="seat-legend">
                <span class="idle">空闲</span>
                <span class="reserved">已预约</span>
                <span class="using">使用中</span>
                <span class="abnormal">异常</span>
            </div>
        </div>
        <!--@seats:/app/pc/reservation-->
    </section>
    <section class="panel-card">    <section class="flow-panel">
        <h2>预约核销流程</h2>
        <div class="timeline-grid">
                            <article class="done">
                    <span></span>
                    <strong>用户预约座位</strong>
                </article>
                            <article class="done">
                    <span></span>
                    <strong>支付或抖音核销</strong>
                </article>
                            <article class="active">
                    <span></span>
                    <strong>门店确认到店</strong>
                </article>
                            <article class="active">
                    <span></span>
                    <strong>座位开始计时</strong>
                </article>
                            <article class="pending">
                    <span></span>
                    <strong>一键买水</strong>
                </article>
                            <article class="pending">
                    <span></span>
                    <strong>结束使用并生成订单</strong>
                </article>
                    </div>
    </section>
    </section></section>
        <section class="panel-card"><div class="panel-head"><h2>预约记录</h2></div>    <!--@reservations-->
    </section>
                    </section>

<script src="/resources/assets/js/app.js?v=0.4.1"></script>
</body>
</html>
