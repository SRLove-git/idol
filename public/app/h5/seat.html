<head>

    <meta name="color-scheme" content="light">
    <title>座位管理 - 拼豆系统</title>
    <link rel="stylesheet" href="/resources/assets/css/app.css?v=0.4.1">
</head>
<body class="theme-cyan terminal-page">
    
    <section class="h5-runtime">
        <main class="h5-app">
                <header class="h5-top">
        <div>
            <span>北京</span>
            <strong>默认门店</strong>
        </div>
        <a href="/app/h5/mine" class="h5-user">我的</a>
    </header>
    <section class="h5-title">
        <h1>座位管理</h1>
        <p>查看空闲座位、预约状态、使用计时、买水和结束使用。</p>
    </section>
                                    <section class="seat-timer-card">
        <span>当前座位</span>
        <strong>A03 · 使用中</strong>
        <p>已计时 01:26:18</p>
            <div class="h5-actions">
                    <a class="is-primary" href="/action/seat?back=/app/h5/seat">修改座位状态</a>
                    <a class="" href="/action/water-order?back=/app/h5/seat">一键买水</a>
                    <a class="" href="/action/reservation?back=/app/h5/seat">创建预约</a>
            </div>
        </section>
        <section class="h5-panel">
        <div class="panel-head">
            <div>
                <h2>座位状态</h2>
                <p>空闲、已预约、使用中、已结束、异常一屏查看。</p>
            </div>
            <div class="seat-legend">
                <span class="idle">空闲</span>
                <span class="reserved">已预约</span>
                <span class="using">使用中</span>
                <span class="abnormal">异常</span>
            </div>
        </div>
        <!--@seats:/app/h5/seat-->
    </section>
        <section class="h5-panel">
        <div class="panel-head"><h2>一键买水</h2><a href="/action/water-order?back=/app/h5/seat">下单</a></div>
            <!--@water-->
        </section>
