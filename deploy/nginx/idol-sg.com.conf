# ===== idol-sg.com：idol 拼豆预约前端（Vue）=====
# 用途：合并进 443 端口的 nginx 反代（本服务器上是 diy-nginx-lb）。
# 前置条件：
#   1) 域名 idol-sg.com 的 A 记录解析到服务器公网 IP；
#   2) idol 栈已部署，idol-frontend 宿主端口 14173 可达（见 .env 的 WEB_PORT）；
#   3) 证书 idol-sg.com.pem / idol-sg.com.key 放在 nginx 的 certs 目录。
# 上游说明：
#   172.20.0.1 = diy-nginx-lb 所在 Docker 网络的宿主机网关；
#   14173      = idol-frontend 的宿主端口。
# 换端口/换网关只需改下面 `set $idol_upstream ...` 这一行。
server {
    listen 443 ssl;
    http2 on;
    server_name idol-sg.com www.idol-sg.com;

    ssl_certificate /etc/nginx/certs/idol-sg.com.pem;
    ssl_certificate_key /etc/nginx/certs/idol-sg.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1g;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    proxy_buffers 32 32k;
    proxy_buffer_size 8k;
    proxy_busy_buffers_size 64k;

    # Docker 内置 DNS（若上游用域名则需此 resolver；用 IP 时可不依赖）
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $idol_upstream http://172.20.0.1:14173;
        proxy_pass $idol_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
